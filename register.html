  <div class="container regis-container">
    <div class="row justify-content-center">
      <!-- ตรงนี้เราจะใช้คลาสเพิ่มเติมเพื่อนำไปตั้งค่าใน CSS เช่น regis-form-card -->
      <div class="col-md-6 col-lg-5 regis-form-card">
        <h2 class="regis-title">Create Account</h2>
  
        <form>
          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label fw-bold">
              Email Address
            </label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Email Address"
              name="email"
            />
          </div>
  
          <!-- First & Last Name -->
          <div class="row g-2">
            <div class="col-md-6">
              <label for="firstName" class="form-label fw-bold">
                First Name
              </label>
              <input
                type="text"
                class="form-control"
                id="firstName"
                placeholder="First Name"
                name="firstName"
              />
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label fw-bold">
                Last Name
              </label>
              <input
                type="text"
                class="form-control"
                id="lastName"
                placeholder="Last Name"
                name="lastName"
              />
            </div>
          </div>
  
          <!-- Password + ปุ่มลูกตา -->
          <div class="mb-3 mt-3">
            <label for="password" class="form-label fw-bold">
              Password
            </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Password"
              />
              <button
                class="btn btn-outline-secondary"
                type="button"
                onclick="togglePassword()"
              >
                <svg
                  id="eyeIcon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  fill="currentColor"
                  class="bi bi-eye"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M16 8s-3-5.5-8-5.5S0 8 
                       0 8s3 5.5 8 5.5 8-5.5 
                       8-5.5zm-8 4a3.5 3.5 0 
                       1 1 0-7 3.5 3.5 0 0 1 
                       0 7z"
                  />
                </svg>
              </button>
            </div>
          </div>
  
          <!-- Register Button -->
          <div class="d-grid mt-4">
            <button class="btn btn-primary" type="submit">
              Register
            </button>
          </div>
        </form>
  
        <!-- Sign In Link -->
        <p class="mt-3 text-center">
          Already have an account?
          <a href="#" class="fw-bold text-decoration-none">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle (รวม Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Toggle Password Script -->
  <script>
    function togglePassword() {
      const passwordField = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");

      if (passwordField.type === "password") {
        passwordField.type = "text";
        eyeIcon.classList.remove("bi-eye");
        eyeIcon.classList.add("bi-eye-slash");
      } else {
        passwordField.type = "password";
        eyeIcon.classList.remove("bi-eye-slash");
        eyeIcon.classList.add("bi-eye");
      }
    }
  </script>

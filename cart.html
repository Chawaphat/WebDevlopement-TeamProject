<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shopping Cart - DekTeadGame</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>

      body {
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
      }



      /* Adjust badge for user profile */
      .user-badge {
        margin-left: 1rem;
      }

      /* Cart container card */
      .cart-card {
        background-color: #fff;
        border-radius: 0.75rem;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        padding: 1.5rem;
      }

      /* Cart item row */
      .cart-item {
        background-color: #f0f0f0;
        border-radius: 0.5rem;
        padding: 1rem;
      }

      .cart-item img {
        border-radius: 0.5rem;
        max-width: 100%;
        height: auto;
      }

      .cart-item h2 {
        font-size: 1.1rem;
        margin-bottom: 0.5rem;
      }

      .original-price {
        text-decoration: line-through;
        color: #666;
      }

      .discount-price {
        color: green;
        margin-left: 0.5rem;
      }

      /* Cart summary area */
      .cart-summary {
        border: 2px solid #0d6efd; /* Bootstrap primary color border */
        border-radius: 0.5rem;
        padding: 1rem;
        margin-top: 1.5rem;
      }

      .cart-summary h4 {
        margin-bottom: 0.5rem;
      }

      .summary-price {
        font-size: 1.5rem;
        font-weight: 600;
      }

      /* Buttons */
      .btn-continue {
        margin-right: 0.5rem;
      }
    </style>
  </head>

  <body>
    
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="margin-right:100px">
          <img src="/img/dekteadgamelogo.png" alt="" width="100" height="30" class="d-inline-block align-text-top">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

          <!-- left side nav -->
          <div class="navbar-nav">
            <a class="nav-link" aria-current="page" href="index.html">Home</a>
            <a class="nav-link active" href="collection.html">Collection</a>
            <a class="nav-link" href="browse.html">Browse</a>
          </div>

          <!-- right side nav -->
          <div class="navbar-nav ms-auto">
              <a class="nav-link" href="cart.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-basket" viewBox="0 0 16 16">

                </svg> CART</a>
              <a class="nav-link" href="profile.html">
                  <img src="/img/IMG_1548.JPEG" alt="" width="30" height="30" class="d-inline-block align-text-top">
              </a>
          </div>

          
        </div>
      </div>
    </nav>

    <!-- Main container -->
    <div class="container py-5">
      <!-- Cart Card -->
      <div class="cart-card">
        <h1 class="mb-4">Shopping Cart</h1>

        <!-- Cart item #1 -->
        <div class="row cart-item mb-3">
          <div class="col-md-2">
            <img src="img/browse_img/Frame 8.png" alt="Elden Ring" />
          </div>
          <div class="col-md-7 mt-2 mt-md-0">
            <h2>Elden Ring</h2>
            <span class="original-price">$34.99</span>
            <span class="discount-price">$23.09</span>
          </div>
          <div class="col-md-3 text-md-end mt-3 mt-md-0">
            <button class="btn btn-outline-danger">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">

              </svg>
            </button>
          </div>
        </div>

        <div class="row cart-item mb-3">
          <div class="col-md-2">
            <img src="img/browse_img/Frame 8.png" alt="Elden Ring" />
          </div>
          <div class="col-md-7 mt-2 mt-md-0">
            <h2>Elden Ring</h2>
            <span class="original-price">$34.99</span>
            <span class="discount-price">$23.09</span>
          </div>
          <div class="col-md-3 text-md-end mt-3 mt-md-0">
            <button class="btn btn-outline-danger">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">
                <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="row cart-summary align-items-center">
          <div class="col-md-6">
            <h4>Estimated Total</h4>
          </div>
          <div class="col-md-6 text-md-end">
            <div class="summary-price mb-3 mb-md-0">$46.18</div>
            <div class="mt-3">
              <a href="#" class="btn btn-dark btn-continue">Continue Shopping</a>
              <button class="btn btn-primary">Purchase</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</html>
